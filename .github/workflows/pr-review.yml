name: Pull Request Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vlang/setup-v@f39f0937037ba37f04636f065002867f28c51cc8
        with:
          version: master
          check-latest: true
      - name: Aggregate PR gates
        run: |
          set -euo pipefail
          make fmt-check
          make vet
          make test
          make build
