name: Release

on:
  push:
    tags:
      - "create-vlang-app@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (create-vlang-app@X.Y.Z). Defaults to ref when empty."
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify version alignment
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            echo "::error::No tag provided" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#create-vlang-app@}" >> "$GITHUB_OUTPUT"
      # Pin the checkout to the resolved tag so a workflow_dispatch from any
      # ref still builds exactly the tagged source (issue #241 backfill).
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: Validate backfill release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "${TAG}" --json tagName --jq .tagName
      - name: Check semver sync
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: ./scripts/check-version-sync.sh "${{ steps.tag.outputs.version }}"

  build:
    name: Build ${{ matrix.asset }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            asset: create-vlang-app-linux-x86_64
            ext: ""
            optional: false
          - runner: ubuntu-latest
            os: linux
            arch: arm64
            asset: create-vlang-app-linux-aarch64
            ext: ""
            optional: true
          - runner: macos-latest
            os: macos
            arch: arm64
            asset: create-vlang-app-darwin-aarch64
            ext: ""
            optional: true
          - runner: macos-15-intel
            os: macos
            arch: amd64
            asset: create-vlang-app-darwin-x86_64
            ext: ""
            optional: true
          - runner: windows-latest
            os: windows
            arch: amd64
            asset: create-vlang-app-windows-x86_64
            ext: .exe
            optional: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: vlang/setup-v@2af0f76cef8d32cea291b7ee9a259c37336a6441
        with:
          version: master
          check-latest: true
          cache: true
      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          make ensure-vmodules
          OUT="dist/${{ matrix.asset }}${{ matrix.ext }}"
          mkdir -p dist
          cd modules/create_vlang_app
          VMODULES="$GITHUB_WORKSPACE/.vmodules" v -prod \
            -os "${{ matrix.os }}" \
            -arch "${{ matrix.arch }}" \
            -o "$GITHUB_WORKSPACE/$OUT" .
          ls -la "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}${{ matrix.ext }}

  release:
    name: Upload GitHub Release assets
    needs: build
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Merge existing release assets (workflow_dispatch backfill)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "::error::tag input is required for release backfill" >&2
            exit 1
          fi
          gh release view "${TAG}" --json assets --jq '.assets[].name' | sort -u > released.txt
          echo "Assets already in ${TAG}:"
          cat released.txt
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          gh release download "${TAG}" -D "${tmp}"
          shopt -s nullglob
          : > backfill-new.txt
          for f in dist/create-vlang-app-*; do
            base="$(basename "${f}")"
            grep -qxF "${base}" released.txt || echo "${base}" >> backfill-new.txt
          done
          # Released bytes are authoritative: overlay them so checksums below
          # always describe exactly what the release stores. Fresh builds
          # survive only for assets missing from the release.
          for f in "${tmp}"/*; do
            cp -f "${f}" "dist/$(basename "${f}")"
          done
          echo "New assets to backfill:"
          cat backfill-new.txt
      - name: Write checksums
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(create-vlang-app-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release artifacts found" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Stage backfill upload set (workflow_dispatch backfill)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p upload
          while IFS= read -r base; do
            if [ -n "${base}" ]; then cp "dist/${base}" upload/; fi
          done < backfill-new.txt
          cp dist/SHA256SUMS upload/
          ls -la upload/
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/create-vlang-app-*
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: false
      - name: Backfill missing assets (workflow_dispatch backfill)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            upload/*
          generate_release_notes: false
          fail_on_unmatched_files: true
