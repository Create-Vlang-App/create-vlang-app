name: Distribution smoke tests

# Smoke-tests published channels: VPM/local binary, Docker, Homebrew tap, AUR.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_NAME: create-vlang-app
  DOCKER_IMAGE: ulisesjeremias/create-vlang-app

concurrency:
  group: smoke-distribution
  cancel-in-progress: true

jobs:
  install-sh:
    name: curl|sh installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install via scripts/install.sh
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/cva-install-bin"
          CVA_INSTALL_DIR="$DEST" sh scripts/install.sh
          export PATH="${DEST}:${PATH}"
          create-vlang-app --version | grep -qE '[0-9]+\.[0-9]+\.[0-9]+'
          create-awesome-vlang-app --version | grep -qE '[0-9]+\.[0-9]+\.[0-9]+'
          test -L "${DEST}/create-awesome-vlang-app"
      - name: Dry-run
        run: CVA_DRY_RUN=1 sh scripts/install.sh

  v-install:
    name: V install / binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vlang/setup-v@16bc9c7c00276f9e5e60f6e53ace2374ff9b59b9
        with:
          version-file: .v-version
      - name: Install module from git (VPM parity) and build CLI
        run: |
          set -euo pipefail
          # v install places the module under ~/.vmodules; it does not put a
          # create-vlang-app binary on PATH. Build from the installed tree.
          v install --git https://github.com/Create-Vlang-App/create-vlang-app@main
          MOD="${HOME}/.vmodules/create_vlang_app_workspace"
          test -d "$MOD"
          make -C "$MOD" build
          export PATH="${MOD}:${PATH}"
          create-vlang-app --version | grep -qE '[0-9]+\.[0-9]+\.[0-9]+'
          create-vlang-app --help | grep -q list-templates
      - name: Run local smoke script
        run: ./scripts/smoke-distribution.sh

  docker:
    name: Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Pull image
        run: docker pull "$DOCKER_IMAGE:latest"
      - name: Verify --version and --help
        run: |
          set -euo pipefail
          docker run --rm "$DOCKER_IMAGE:latest" --version | grep -qE '[0-9]+\.[0-9]+\.[0-9]+'
          docker run --rm "$DOCKER_IMAGE:latest" --help | grep -q list-templates

  homebrew:
    name: Homebrew (Create-Vlang-App/tap)
    runs-on: macos-latest
    steps:
      - name: Tap and install
        run: |
          set -euo pipefail
          brew tap Create-Vlang-App/tap
          # Homebrew 5+ refuses third-party taps until explicitly trusted.
          brew trust Create-Vlang-App/tap
          brew install create-vlang-app
      - name: Verify CLI
        run: |
          create-vlang-app --version | grep -qE '[0-9]+\.[0-9]+\.[0-9]+'
          create-vlang-app --help | grep -q list-addons

  aur:
    name: AUR (archlinux container)
    runs-on: ubuntu-latest
    steps:
      - name: Build AUR -bin package (prebuilt)
        run: |
          set -euo pipefail
          docker run --rm \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Sy --noconfirm --needed base-devel git sudo
              useradd -m -G wheel builder
              echo "%wheel ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              runuser -u builder -- bash -euo pipefail -c "
                git clone https://aur.archlinux.org/create-awesome-vlang-app-bin.git /tmp/cva
                cd /tmp/cva
                makepkg -si --noconfirm --skippgpcheck
                create-vlang-app --version | grep -qE \"[0-9]+\\.[0-9]+\\.[0-9]+\"
                create-awesome-vlang-app --version | grep -qE \"[0-9]+\\.[0-9]+\\.[0-9]+\"
              "
            '

  versions:
    name: Cross-check published versions
    runs-on: ubuntu-latest
    if: always()
    needs: [install-sh, v-install, docker, homebrew, aur]
    steps:
      - name: Summarize channel versions
        run: |
          set -euo pipefail
          REL_API=https://api.github.com/repos/Create-Vlang-App/create-vlang-app/releases/latest
          BREW_RAW=https://raw.githubusercontent.com/Create-Vlang-App/homebrew-tap/main/Formula/create-vlang-app.rb
          AUR_RPC='https://aur.archlinux.org/rpc/v5/info?arg=create-awesome-vlang-app-bin'
          MODULE=$(curl -sfL "$REL_API" | python3 -c \
            "import json,sys; r=json.load(sys.stdin); print(r.get('tag_name','missing').replace('create-vlang-app@',''))" \
            || echo unavailable)
          FORMULA=$(curl -sfL "$BREW_RAW" | grep -oE 'version "[0-9]+\.[0-9]+\.[0-9]+"' | head -1 \
            || echo unavailable)
          AUR=$(curl -sfL "$AUR_RPC" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          r=d.get('results') or []
          print(r[0]['Version'].split('-')[0] if r else 'unavailable')
          " || echo unavailable)
          {
            echo "## Distribution smoke versions"
            echo "| Channel | Version |"
            echo "|---------|---------|"
            echo "| GitHub Release | $MODULE |"
            echo "| Homebrew formula | $FORMULA |"
            echo "| AUR | $AUR |"
          } >> "$GITHUB_STEP_SUMMARY"
